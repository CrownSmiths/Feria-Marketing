services:
  php:
    image: php:8.5-apache
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: feria-marketing-mysql
    environment:
      MYSQL_DATABASE: fs2026_crownsmith
      MYSQL_USER: fs2026_crownsmith
      MYSQL_PASSWORD: 37RqkuL8
      MYSQL_ROOT_PASSWORD: 37RqkuL8
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p37RqkuL8"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
